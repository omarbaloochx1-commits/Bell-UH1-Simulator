name: Extract ZIP and Build APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Find and extract ZIP files
    run: |
      mkdir -p extracted
      find . -maxdepth 2 -type f -iname "*.zip" -print -exec unzip -o {} -d extracted \;

      if [ -f extracted/settings.gradle ]; then
        PROJECT_DIR="extracted"
      else
        PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
      fi

      if [ -z "$PROJECT_DIR" ]; then
        echo "Gradle project not found inside ZIP!"
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Android-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
